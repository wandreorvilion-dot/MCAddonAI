name: Build MCAddonAI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK e NDK
        uses: android-actions/setup-android@v3

      - name: Baixar motor llama.cpp
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 https://github.com app/src/main/cpp/llama.cpp

      - name: Gerar Gradle Wrapper e Compilar APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: MCAddonAI-Studio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
